[project]
name = "laimory-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.136.3",
    "uvicorn[standard]>=0.49.0",
    "python-dotenv>=1.1.0",
    "rich>=14.0.0",
    "pydantic-settings>=2.5.0",
    "openai>=1.50.0",
    "google-genai>=1.0.0",
    "langgraph>=1.2.7",
    "httpx>=0.27.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "aiomysql>=0.2.0",
    "boto3>=1.43.53",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=0.24.0",
    "aiosqlite>=0.20.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: 외부 서비스나 큰 fixture 를 사용하는 통합 테스트",
    "live_llm: 실제 LLM provider 를 호출하는 테스트",
]
