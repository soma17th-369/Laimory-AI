name: Deploy AgentCore Runtime

# EC2 전환 뒤의 수동 복구 경로다. dev 자동 배포는 deploy-ec2.yml 이 담당한다.
# AgentCore 문제가 해소됐을 때만 Actions 화면에서 직접 실행한다.
on:
  workflow_dispatch:

# OIDC 로 AWS 임시 자격증명을 받는다. 장기 액세스 키는 저장소에 두지 않는다.
permissions:
  id-token: write
  contents: read

# 배포는 겹치면 안 된다. 진행 중인 배포를 취소하면 Runtime 이 UPDATING 에서 멈출 수 있어
# cancel-in-progress 를 켜지 않는다.
concurrency:
  group: deploy-agentcore
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
  AGENTCORE_RUNTIME_ID: ${{ vars.AGENTCORE_RUNTIME_ID }}
  AGENTCORE_ENDPOINT_NAME: ${{ vars.AGENTCORE_ENDPOINT_NAME }}
  # aws cli 가 결과를 pager 로 띄워 스텝이 멈추는 것을 막는다.
  AWS_PAGER: ""

jobs:
  build:
    name: 빌드 & ECR 업로드
    runs-on: ubuntu-latest
    outputs:
      image-uri: ${{ steps.meta.outputs.image-uri }}
      image-tag: ${{ steps.meta.outputs.image-tag }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 필수 설정 확인
        env:
          ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "${AWS_REGION}" ] || missing+=(AWS_REGION)
          [ -n "${ECR_REPOSITORY}" ] || missing+=(ECR_REPOSITORY)
          [ -n "${ROLE_ARN}" ] || missing+=(AWS_DEPLOY_ROLE_ARN)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::저장소 변수/시크릿이 비어 있다: ${missing[*]}. docs/deploy-agentcore.md 참고."
            exit 1
          fi

      - name: AWS 인증 (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: ECR 로그인
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # AgentCore 는 linux/arm64 만 실행한다. x86 러너에서 arm64 를 빌드하려면 binfmt 가 필요하다.
      - name: QEMU (arm64 에뮬레이션)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Buildx
        uses: docker/setup-buildx-action@v3

      # 이미지 태그는 커밋 SHA 로 못박는다. 이게 "어느 커밋이 지금 떠 있는가" 의 정본이다.
      # dev 태그는 최신을 가리키는 이동 태그라 배포 이력 추적에는 쓰지 않는다.
      - name: 이미지 태그 결정
        id: meta
        run: |
          set -euo pipefail
          tag="sha-$(git rev-parse --short=12 HEAD)"
          registry="${{ steps.ecr.outputs.registry }}"
          echo "image-tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "image-uri=${registry}/${ECR_REPOSITORY}:${tag}" >> "$GITHUB_OUTPUT"

      - name: 빌드 & 푸시
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          # provenance attestation 을 붙이면 단일 플랫폼 이미지도 manifest list 로 밀려
          # 올라가고, containerUri 를 받는 쪽이 이를 해석하지 못할 수 있다.
          provenance: false
          tags: |
            ${{ steps.meta.outputs.image-uri }}
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:dev
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 빌드 요약
        run: |
          {
            echo "## 이미지 빌드"
            echo ""
            echo "| 항목 | 값 |"
            echo "|---|---|"
            echo "| 커밋 | \`${GITHUB_SHA}\` |"
            echo "| 태그 | \`${{ steps.meta.outputs.image-tag }}\` |"
            echo "| digest | \`${{ steps.build.outputs.digest }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: AgentCore Runtime 배포
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 필수 설정 확인
        run: |
          set -euo pipefail
          missing=()
          [ -n "${AGENTCORE_RUNTIME_ID}" ] || missing+=(AGENTCORE_RUNTIME_ID)
          [ -n "${AGENTCORE_ENDPOINT_NAME}" ] || missing+=(AGENTCORE_ENDPOINT_NAME)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::저장소 변수가 비어 있다: ${missing[*]}. Runtime 과 엔드포인트를 먼저 만들어야 한다(docs/deploy-agentcore.md)."
            exit 1
          fi

      - name: AWS 인증 (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # bedrock-agentcore-control 은 비교적 최근에 추가된 서비스라 러너에 미리 깔린
      # aws cli 가 모를 수 있다. 지원 여부를 보고 필요할 때만 갱신한다.
      - name: AWS CLI AgentCore 지원 확인
        run: |
          set -euo pipefail
          if aws bedrock-agentcore-control get-agent-runtime --generate-cli-skeleton >/dev/null 2>&1; then
            echo "지원함: $(aws --version)"
          else
            echo "AgentCore 미지원($(aws --version)) — AWS CLI v2 를 최신으로 갱신한다."
            curl -sSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/awscliv2.zip
            unzip -q /tmp/awscliv2.zip -d /tmp
            sudo /tmp/aws/install --update
            aws --version
          fi

      # 롤백 지점이다. 새 버전으로 넘기기 전에 지금 서비스 중인 버전을 먼저 기록해 둔다.
      - name: 현재 엔드포인트 버전 기록
        id: before
        run: |
          set -euo pipefail
          live=$(aws bedrock-agentcore-control get-agent-runtime-endpoint \
            --agent-runtime-id "$AGENTCORE_RUNTIME_ID" \
            --endpoint-name "$AGENTCORE_ENDPOINT_NAME" \
            --region "$AWS_REGION" \
            --query 'liveVersion' --output text)
          echo "배포 직전 서비스 버전: ${live}"
          echo "live-version=${live}" >> "$GITHUB_OUTPUT"

      # UpdateAgentRuntime 은 부분 수정(patch)이 아니라 전체 교체다. roleArn 과
      # networkConfiguration 이 필수이고, environmentVariables 를 빼고 부르면 기존 값이
      # 사라진다. 그래서 현재 설정을 읽어 그대로 되돌려 보내고 컨테이너 이미지만 바꾼다.
      # 덕분에 DB 접속·콜백 URL 같은 운영 설정은 AWS 에만 있고 GitHub 에 둘 필요가 없다.
      - name: Runtime 새 버전 생성
        id: update
        env:
          IMAGE_URI: ${{ needs.build.outputs.image-uri }}
        run: |
          set -euo pipefail
          # 주의: 이 응답에는 environmentVariables 가 들어 있다. 로그로 찍지 않는다.
          current=$(aws bedrock-agentcore-control get-agent-runtime \
            --agent-runtime-id "$AGENTCORE_RUNTIME_ID" \
            --region "$AWS_REGION")

          args=(
            --agent-runtime-id "$AGENTCORE_RUNTIME_ID"
            --agent-runtime-artifact "$(jq -nc --arg uri "$IMAGE_URI" '{containerConfiguration:{containerUri:$uri}}')"
            --role-arn "$(jq -r '.roleArn' <<<"$current")"
            --network-configuration "$(jq -c '.networkConfiguration' <<<"$current")"
          )
          # `[ -n "$x" ] && args+=(...)` 로 줄이면 그 줄이 마지막 명령이 되는 순간
          # set -e 에 걸려 스텝이 죽는다. 순서가 바뀌어도 안전하도록 if 로 쓴다.
          protocol=$(jq -c '.protocolConfiguration // empty' <<<"$current")
          if [ -n "$protocol" ]; then
            args+=(--protocol-configuration "$protocol")
          fi
          envvars=$(jq -c '.environmentVariables // empty' <<<"$current")
          if [ -n "$envvars" ]; then
            args+=(--environment-variables "$envvars")
          fi

          result=$(aws bedrock-agentcore-control update-agent-runtime \
            "${args[@]}" --region "$AWS_REGION")
          version=$(jq -r '.agentRuntimeVersion' <<<"$result")
          echo "새 Runtime 버전: ${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Runtime READY 대기
        run: |
          set -euo pipefail
          for _ in $(seq 1 90); do
            status=$(aws bedrock-agentcore-control get-agent-runtime \
              --agent-runtime-id "$AGENTCORE_RUNTIME_ID" \
              --region "$AWS_REGION" --query 'status' --output text)
            case "$status" in
              READY)
                echo "Runtime READY"
                exit 0
                ;;
              CREATE_FAILED|UPDATE_FAILED)
                reason=$(aws bedrock-agentcore-control get-agent-runtime \
                  --agent-runtime-id "$AGENTCORE_RUNTIME_ID" \
                  --region "$AWS_REGION" --query 'failureReason' --output text)
                echo "::error::Runtime 상태 ${status}: ${reason}"
                exit 1
                ;;
            esac
            echo "대기 중... (${status})"
            sleep 10
          done
          echo "::error::Runtime 이 15분 안에 READY 가 되지 않았다."
          exit 1

      # 실제 트래픽 전환. 엔드포인트가 어느 버전을 가리키느냐가 배포이고, 이걸
      # 되돌리는 것이 롤백이다(rollback-agentcore.yml).
      - name: 엔드포인트를 새 버전으로 전환
        run: |
          set -euo pipefail
          aws bedrock-agentcore-control update-agent-runtime-endpoint \
            --agent-runtime-id "$AGENTCORE_RUNTIME_ID" \
            --endpoint-name "$AGENTCORE_ENDPOINT_NAME" \
            --agent-runtime-version "${{ steps.update.outputs.version }}" \
            --region "$AWS_REGION" \
            --query '{status:status,target:targetVersion,live:liveVersion}'

      - name: 엔드포인트 READY 대기
        run: |
          set -euo pipefail
          for _ in $(seq 1 90); do
            read -r status live < <(aws bedrock-agentcore-control get-agent-runtime-endpoint \
              --agent-runtime-id "$AGENTCORE_RUNTIME_ID" \
              --endpoint-name "$AGENTCORE_ENDPOINT_NAME" \
              --region "$AWS_REGION" --query '[status,liveVersion]' --output text)
            case "$status" in
              READY)
                echo "엔드포인트 READY (서비스 버전 ${live})"
                exit 0
                ;;
              CREATE_FAILED|UPDATE_FAILED)
                reason=$(aws bedrock-agentcore-control get-agent-runtime-endpoint \
                  --agent-runtime-id "$AGENTCORE_RUNTIME_ID" \
                  --endpoint-name "$AGENTCORE_ENDPOINT_NAME" \
                  --region "$AWS_REGION" --query 'failureReason' --output text)
                echo "::error::엔드포인트 상태 ${status}: ${reason}"
                exit 1
                ;;
            esac
            echo "대기 중... (${status})"
            sleep 10
          done
          echo "::error::엔드포인트가 15분 안에 READY 가 되지 않았다."
          exit 1

      # 배포 이력. 이미지 태그 ↔ Runtime 버전 ↔ 엔드포인트가 한 줄로 남고,
      # 문제가 생겼을 때 되돌릴 버전이 함께 적힌다.
      - name: 배포 요약
        if: always()
        run: |
          {
            echo "## AgentCore Runtime 배포"
            echo ""
            echo "| 항목 | 값 |"
            echo "|---|---|"
            echo "| 커밋 | \`${GITHUB_SHA}\` |"
            echo "| 이미지 태그 | \`${{ needs.build.outputs.image-tag }}\` |"
            echo "| digest | \`${{ needs.build.outputs.digest }}\` |"
            echo "| Runtime ID | \`${AGENTCORE_RUNTIME_ID}\` |"
            echo "| 새 Runtime 버전 | \`${{ steps.update.outputs.version }}\` |"
            echo "| 엔드포인트 | \`${AGENTCORE_ENDPOINT_NAME}\` |"
            echo "| 직전 서비스 버전 | \`${{ steps.before.outputs.live-version }}\` |"
            echo ""
            echo "문제가 생기면 **Rollback AgentCore Runtime** 워크플로를 \`${{ steps.before.outputs.live-version }}\` 으로 실행한다."
          } >> "$GITHUB_STEP_SUMMARY"
