name: Deploy Production

# main 이 production 의 정본이다. `dev → main` PR 이 merge 되어 main 에 push 가 생기면
# 이 워크플로가 돈다. PR 을 열거나 고치는 시점에는 돌지 않는다(push 이벤트라 그렇다).
#
# 배포 대상은 AgentCore Runtime 이고, dev 는 deploy-ec2.yml 로 EC2 에 나간다. 두 경로는
# 브랜치·워크플로·ECR 저장소·Environment 가 갈라져 있다. IAM 배포 역할은 공용이다.
#
# path 필터를 두지 않는다. main HEAD 와 운영에 떠 있는 커밋이 어긋나지 않게 하는 쪽이,
# 문서만 바뀐 merge 에서 빌드 한 번을 아끼는 것보다 중요하다.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

# 배포와 롤백이 같은 그룹을 쓴다. 동시에 돌면 엔드포인트 상태가 꼬인다.
# 진행 중인 배포를 취소하면 Runtime 이 UPDATING 에서 멈출 수 있어 cancel-in-progress 는 끈다.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  # production 전용 저장소다. dev 의 ECR_REPOSITORY 와 이름을 가른 이유는
  # scripts/prune_ecr_images.py 가 저장소 전체에서 EC2 배포 태그가 없는 이미지를 지우기
  # 때문이다. 한 저장소를 공유하면 dev merge 한 번에 운영 arm64 이미지가 사라진다.
  # 이름이 같으면 Environment 등록을 빠뜨렸을 때 저장소 값(laimory-ai)이 조용히 쓰인다.
  ECR_REPOSITORY: ${{ vars.PROD_ECR_REPOSITORY }}
  AGENTCORE_RUNTIME_ID: ${{ vars.AGENTCORE_RUNTIME_ID }}
  AGENTCORE_ENDPOINT_NAME: ${{ vars.AGENTCORE_ENDPOINT_NAME }}
  # aws cli 가 결과를 pager 로 띄워 스텝이 멈추는 것을 막는다.
  AWS_PAGER: ""

jobs:
  # job 하나로 둔다. environment 를 선언한 job 만 production 자격증명을 받고 승인 게이트에
  # 걸리므로, 빌드와 배포를 나누면 같은 환경을 두 번 승인해야 한다.
  #
  # job 이름을 바꾸면 ruleset 의 필수 check 이름이 어긋나 보호가 조용히 풀린다.
  # tests/scripts/test_workflow_contracts.py 가 이 이름을 고정한다.
  deploy:
    name: production 배포
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 필수 설정 확인
        env:
          ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "${AWS_REGION}" ] || missing+=(AWS_REGION)
          [ -n "${ECR_REPOSITORY}" ] || missing+=(PROD_ECR_REPOSITORY)
          [ -n "${AGENTCORE_RUNTIME_ID}" ] || missing+=(AGENTCORE_RUNTIME_ID)
          [ -n "${AGENTCORE_ENDPOINT_NAME}" ] || missing+=(AGENTCORE_ENDPOINT_NAME)
          [ -n "${ROLE_ARN}" ] || missing+=(AWS_DEPLOY_ROLE_ARN)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Environment 'production' 의 변수/시크릿이 비어 있다: ${missing[*]}. docs/deploy-production.md 참고."
            exit 1
          fi

      # 배포 역할은 dev(EC2)와 **공용**이다. 저장소 수준 secret 하나를 쓴다.
      # 그래서 이 역할의 trust policy 에는 `ref:refs/heads/dev` 와
      # `environment:production` 이 둘 다 들어 있고 권한도 두 경로의 합집합이다.
      # 자원 경계는 역할이 아니라 ECR 저장소와 Environment 승인 게이트가 만든다.
      - name: AWS 인증 (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: ECR 로그인
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # AgentCore 는 linux/arm64 만 실행한다. x86 러너에서 arm64 를 빌드하려면 binfmt 가 필요하다.
      - name: QEMU (arm64 에뮬레이션)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Buildx
        uses: docker/setup-buildx-action@v3

      # 태그는 커밋 SHA 로 못박고 **이동 태그를 만들지 않는다**. 롤백이 성립하려면
      # "Runtime 버전 N ↔ 이미지" 가 1:1 로 고정돼야 하는데, latest·dev 같은 이동 태그를
      # containerUri 에 쓰면 서로 다른 버전이 같은 문자열을 가리켜 되돌려도 같은 이미지가 뜬다.
      # run id 와 attempt 까지 넣어 같은 커밋을 재실행해도 기존 태그를 덮어쓰지 않는다.
      - name: 이미지 태그 결정
        id: meta
        run: |
          set -euo pipefail
          short_sha="$(git rev-parse --short=12 HEAD)"
          tag="prod-sha-${short_sha}-arm64-run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          registry="${{ steps.ecr.outputs.registry }}"
          echo "image-tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "image-uri=${registry}/${ECR_REPOSITORY}:${tag}" >> "$GITHUB_OUTPUT"

      - name: arm64 빌드 & ECR 푸시
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          # provenance attestation 을 붙이면 단일 플랫폼 이미지도 manifest list 로 밀려
          # 올라가고, containerUri 를 받는 쪽이 이를 해석하지 못할 수 있다.
          provenance: false
          tags: ${{ steps.meta.outputs.image-uri }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # bedrock-agentcore-control 은 비교적 최근에 추가된 서비스라 러너에 미리 깔린
      # aws cli 가 모를 수 있다. 지원 여부를 보고 필요할 때만 갱신한다.
      - name: AWS CLI AgentCore 지원 확인
        run: |
          set -euo pipefail
          if aws bedrock-agentcore-control get-agent-runtime --generate-cli-skeleton >/dev/null 2>&1; then
            echo "지원함: $(aws --version)"
          else
            echo "AgentCore 미지원($(aws --version)) — AWS CLI v2 를 최신으로 갱신한다."
            curl -sSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/awscliv2.zip
            unzip -q /tmp/awscliv2.zip -d /tmp
            sudo /tmp/aws/install --update
            aws --version
          fi

      # 롤백 지점이다. 새 버전으로 넘기기 전에 지금 서비스 중인 버전을 먼저 기록해 둔다.
      - name: 현재 엔드포인트 버전 기록
        id: before
        run: |
          set -euo pipefail
          live=$(aws bedrock-agentcore-control get-agent-runtime-endpoint \
            --agent-runtime-id "$AGENTCORE_RUNTIME_ID" \
            --endpoint-name "$AGENTCORE_ENDPOINT_NAME" \
            --region "$AWS_REGION" \
            --query 'liveVersion' --output text)
          echo "배포 직전 서비스 버전: ${live}"
          echo "live-version=${live}" >> "$GITHUB_OUTPUT"

      # UpdateAgentRuntime 은 부분 수정(patch)이 아니라 전체 교체다. roleArn 과
      # networkConfiguration 이 필수이고, environmentVariables 를 빼고 부르면 기존 값이
      # 사라진다. 그래서 현재 설정을 읽어 그대로 되돌려 보내고 컨테이너 이미지만 바꾼다.
      # 덕분에 App Server URL 같은 운영 설정은 AWS 에만 있고 GitHub 에 둘 필요가 없다.
      #
      # ECR push 자체는 배포가 아니다. AgentCore 는 ECR 을 감시하지 않는다. 이 호출이
      # 새 Runtime 버전을 만들고, 다음 스텝의 엔드포인트 전환이 실제 배포다.
      - name: Runtime 새 버전 생성
        id: update
        env:
          IMAGE_URI: ${{ steps.meta.outputs.image-uri }}
        run: |
          set -euo pipefail
          # 주의: 이 응답에는 environmentVariables 가 들어 있다. 로그로 찍지 않는다.
          current=$(aws bedrock-agentcore-control get-agent-runtime \
            --agent-runtime-id "$AGENTCORE_RUNTIME_ID" \
            --region "$AWS_REGION")

          args=(
            --agent-runtime-id "$AGENTCORE_RUNTIME_ID"
            --agent-runtime-artifact "$(jq -nc --arg uri "$IMAGE_URI" '{containerConfiguration:{containerUri:$uri}}')"
            --role-arn "$(jq -r '.roleArn' <<<"$current")"
            --network-configuration "$(jq -c '.networkConfiguration' <<<"$current")"
          )
          # `[ -n "$x" ] && args+=(...)` 로 줄이면 그 줄이 마지막 명령이 되는 순간
          # set -e 에 걸려 스텝이 죽는다. 순서가 바뀌어도 안전하도록 if 로 쓴다.
          protocol=$(jq -c '.protocolConfiguration // empty' <<<"$current")
          if [ -n "$protocol" ]; then
            args+=(--protocol-configuration "$protocol")
          fi
          envvars=$(jq -c '.environmentVariables // empty' <<<"$current")
          if [ -n "$envvars" ]; then
            args+=(--environment-variables "$envvars")
          fi

          result=$(aws bedrock-agentcore-control update-agent-runtime \
            "${args[@]}" --region "$AWS_REGION")
          version=$(jq -r '.agentRuntimeVersion' <<<"$result")
          echo "새 Runtime 버전: ${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      # 치명 health gate 1. AgentCore 가 컨테이너의 GET /ping 을 확인해야 READY 로 올린다.
      # 아직 엔드포인트를 전환하지 않았으므로 여기서 실패해도 서비스는 옛 버전 그대로다.
      - name: Runtime READY 대기
        run: |
          set -euo pipefail
          for _ in $(seq 1 90); do
            status=$(aws bedrock-agentcore-control get-agent-runtime \
              --agent-runtime-id "$AGENTCORE_RUNTIME_ID" \
              --region "$AWS_REGION" --query 'status' --output text)
            case "$status" in
              READY)
                echo "Runtime READY"
                exit 0
                ;;
              CREATE_FAILED|UPDATE_FAILED)
                reason=$(aws bedrock-agentcore-control get-agent-runtime \
                  --agent-runtime-id "$AGENTCORE_RUNTIME_ID" \
                  --region "$AWS_REGION" --query 'failureReason' --output text)
                echo "::error::Runtime 상태 ${status}: ${reason}"
                exit 1
                ;;
            esac
            echo "대기 중... (${status})"
            sleep 10
          done
          echo "::error::Runtime 이 15분 안에 READY 가 되지 않았다."
          exit 1

      # 실제 트래픽 전환. 엔드포인트가 어느 버전을 가리키느냐가 배포다.
      # 이 스텝부터는 실패 시 되돌릴 것이 생기므로 switched 플래그를 남긴다.
      - name: 엔드포인트를 새 버전으로 전환
        id: switch
        run: |
          set -euo pipefail
          echo "switched=true" >> "$GITHUB_OUTPUT"
          aws bedrock-agentcore-control update-agent-runtime-endpoint \
            --agent-runtime-id "$AGENTCORE_RUNTIME_ID" \
            --endpoint-name "$AGENTCORE_ENDPOINT_NAME" \
            --agent-runtime-version "${{ steps.update.outputs.version }}" \
            --region "$AWS_REGION" \
            --query '{status:status,target:targetVersion,live:liveVersion}'

      # 치명 health gate 2. 엔드포인트도 컨테이너가 /ping 에 답해야 READY 가 된다.
      - name: 엔드포인트 READY 대기
        run: |
          set -euo pipefail
          for _ in $(seq 1 90); do
            read -r status live < <(aws bedrock-agentcore-control get-agent-runtime-endpoint \
              --agent-runtime-id "$AGENTCORE_RUNTIME_ID" \
              --endpoint-name "$AGENTCORE_ENDPOINT_NAME" \
              --region "$AWS_REGION" --query '[status,liveVersion]' --output text)
            case "$status" in
              READY)
                echo "엔드포인트 READY (서비스 버전 ${live})"
                exit 0
                ;;
              CREATE_FAILED|UPDATE_FAILED)
                reason=$(aws bedrock-agentcore-control get-agent-runtime-endpoint \
                  --agent-runtime-id "$AGENTCORE_RUNTIME_ID" \
                  --endpoint-name "$AGENTCORE_ENDPOINT_NAME" \
                  --region "$AWS_REGION" --query 'failureReason' --output text)
                echo "::error::엔드포인트 상태 ${status}: ${reason}"
                exit 1
                ;;
            esac
            echo "대기 중... (${status})"
            sleep 10
          done
          echo "::error::엔드포인트가 15분 안에 READY 가 되지 않았다."
          exit 1

      # 호출 계약 스모크. **배포를 실패시키지 않는다.**
      # invoke-agent-runtime 의 인자 형태가 CLI 버전마다 다르고 아직 실운영으로 확인한
      # 적이 없어, 오탐이 정상 배포를 되돌리는 쪽이 더 위험하다. 요약에만 남긴다.
      #
      # payload 의 requestType 은 반드시 **알 수 없는 값**이어야 한다. app/api/agentcore.py
      # 가 requestType 키가 없는 body 를 TIMELINE 으로 감싸므로, 빈 body 를 보내면 진짜
      # 타임라인 작업이 접수된다. 알 수 없는 값이면 스키마 검증에서 막혀 작업이 생기지 않고
      # 오류 응답만 돌아오며, 그 응답 자체가 컨테이너가 살아 있다는 증거다.
      - name: 호출 스모크 (비치명)
        id: smoke
        continue-on-error: true
        run: |
          set -uo pipefail
          arn=$(aws bedrock-agentcore-control get-agent-runtime \
            --agent-runtime-id "$AGENTCORE_RUNTIME_ID" \
            --region "$AWS_REGION" --query 'agentRuntimeArn' --output text)

          if aws bedrock-agentcore invoke-agent-runtime \
            --agent-runtime-arn "$arn" \
            --qualifier "$AGENTCORE_ENDPOINT_NAME" \
            --payload '{"requestType":"__DEPLOY_SMOKE__"}' \
            --region "$AWS_REGION" /tmp/smoke.json 2>/tmp/smoke.err; then
            if jq -e 'has("errorCode")' /tmp/smoke.json >/dev/null 2>&1; then
              echo "result=응답함 (스키마 거절 = 컨테이너 정상)" >> "$GITHUB_OUTPUT"
            else
              echo "result=응답함 (본문 형태 미확인)" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "::warning::호출 스모크가 응답을 받지 못했다. 배포는 계속한다(엔드포인트는 READY). docs/deploy-production.md 참고."
            echo "result=확인 실패" >> "$GITHUB_OUTPUT"
          fi

      # 자동 복구. 엔드포인트를 이미 새 버전으로 넘긴 뒤에 실패했을 때만 돈다.
      # 되돌리는 대상은 직전까지 실제로 서비스하던 버전이라 이미 검증돼 있다.
      # 스모크는 continue-on-error 라 여기로 오지 않는다.
      - name: 실패 시 이전 버전으로 자동 복구
        if: failure() && steps.switch.outputs.switched == 'true' && steps.before.outputs.live-version != ''
        env:
          PREVIOUS_VERSION: ${{ steps.before.outputs.live-version }}
        run: |
          set -euo pipefail
          echo "::warning::배포에 실패해 엔드포인트를 버전 ${PREVIOUS_VERSION} 으로 되돌린다."
          aws bedrock-agentcore-control update-agent-runtime-endpoint \
            --agent-runtime-id "$AGENTCORE_RUNTIME_ID" \
            --endpoint-name "$AGENTCORE_ENDPOINT_NAME" \
            --agent-runtime-version "$PREVIOUS_VERSION" \
            --region "$AWS_REGION" \
            --query '{status:status,target:targetVersion,live:liveVersion}'
          echo "되돌리기 요청을 보냈다. Actions 요약과 엔드포인트 상태를 확인한다."

      # 배포 이력. 커밋 ↔ 이미지 태그 ↔ digest ↔ Runtime 버전 ↔ 엔드포인트가 한 줄로 남고,
      # 되돌릴 버전이 함께 적힌다.
      - name: 배포 요약
        if: always()
        run: |
          {
            echo "## Production 배포 (AgentCore Runtime)"
            echo ""
            echo "| 항목 | 값 |"
            echo "|---|---|"
            echo "| 커밋 | \`${GITHUB_SHA}\` |"
            echo "| ECR 저장소 | \`${ECR_REPOSITORY}\` |"
            echo "| 이미지 태그 | \`${{ steps.meta.outputs.image-tag }}\` |"
            echo "| digest | \`${{ steps.build.outputs.digest }}\` |"
            echo "| Runtime ID | \`${AGENTCORE_RUNTIME_ID}\` |"
            echo "| 새 Runtime 버전 | \`${{ steps.update.outputs.version || '생성 안 됨' }}\` |"
            echo "| 엔드포인트 | \`${AGENTCORE_ENDPOINT_NAME}\` |"
            echo "| 직전 서비스 버전 | \`${{ steps.before.outputs.live-version || '확인 불가' }}\` |"
            echo "| 호출 스모크 | \`${{ steps.smoke.outputs.result || '실행 안 됨' }}\` |"
            echo ""
            echo "문제가 생기면 **Rollback Production** 워크플로를 \`${{ steps.before.outputs.live-version }}\` 으로 실행한다."
          } >> "$GITHUB_STEP_SUMMARY"
