name: Deploy EC2

# dev에 반영된 애플리케이션을 t3 계열 EC2용 amd64 이미지로 만들고,
# Systems Manager Run Command로 기존 EC2의 단일 컨테이너를 교체한다.
on:
  push:
    branches: [dev]
    paths:
      - "app/**"
      - "Dockerfile"
      - ".dockerignore"
      - "pyproject.toml"
      - "uv.lock"
      - "scripts/deploy-ec2.sh"
      - "scripts/prune_ecr_images.py"
      - ".github/workflows/deploy-ec2.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-ec2
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
  EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
  AWS_PAGER: ""

jobs:
  deploy:
    name: amd64 빌드 & EC2 배포
    runs-on: ubuntu-latest
    outputs:
      image-uri: ${{ steps.meta.outputs.image-uri }}
      image-tag: ${{ steps.meta.outputs.image-tag }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 필수 설정 확인
        env:
          ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "${AWS_REGION}" ] || missing+=(AWS_REGION)
          [ -n "${ECR_REPOSITORY}" ] || missing+=(ECR_REPOSITORY)
          [ -n "${EC2_INSTANCE_ID}" ] || missing+=(EC2_INSTANCE_ID)
          [ -n "${ROLE_ARN}" ] || missing+=(AWS_DEPLOY_ROLE_ARN)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::저장소 변수/시크릿이 비어 있습니다: ${missing[*]}. docs/deploy-ec2.md 참고."
            exit 1
          fi
          if [[ ! "${EC2_INSTANCE_ID}" =~ ^i-[0-9a-f]{8}([0-9a-f]{9})?$ ]]; then
            echo "::error::EC2_INSTANCE_ID 형식이 올바르지 않습니다: ${EC2_INSTANCE_ID}"
            exit 1
          fi

      - name: AWS 인증 (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: ECR 로그인
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Buildx
        uses: docker/setup-buildx-action@v3

      # run id와 attempt까지 포함해 같은 커밋을 재실행해도 기존 태그를 덮어쓰지 않는다.
      - name: 이미지 태그 결정
        id: meta
        run: |
          set -euo pipefail
          short_sha="$(git rev-parse --short=12 HEAD)"
          tag="sha-${short_sha}-amd64-run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          registry="${{ steps.ecr.outputs.registry }}"
          echo "image-tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "image-uri=${registry}/${ECR_REPOSITORY}:${tag}" >> "$GITHUB_OUTPUT"

      - name: amd64 빌드 & ECR 푸시
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.image-uri }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: SSM으로 EC2 배포
        id: ssm
        env:
          IMAGE_URI: ${{ steps.meta.outputs.image-uri }}
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          set -euo pipefail
          script_base64="$(base64 -w 0 scripts/deploy-ec2.sh)"
          remote_command="$(jq -nr \
            --arg script "$script_base64" \
            --arg image "$IMAGE_URI" \
            --arg region "$AWS_REGION" \
            --arg registry "$ECR_REGISTRY" \
            '"printf %s " + ($script | @sh) + " | base64 -d > /tmp/laimory-deploy-ec2.sh && chmod 700 /tmp/laimory-deploy-ec2.sh && /tmp/laimory-deploy-ec2.sh " + ($image | @sh) + " " + ($region | @sh) + " " + ($registry | @sh)' \
          )"
          parameters="$(jq -nc --arg command "$remote_command" '{commands:[$command]}')"

          command_id="$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Laimory-AI ${GITHUB_SHA}" \
            --timeout-seconds 1800 \
            --parameters "$parameters" \
            --query 'Command.CommandId' \
            --output text)"
          echo "SSM command: ${command_id}"
          echo "command-id=${command_id}" >> "$GITHUB_OUTPUT"

          for _ in $(seq 1 360); do
            result="$(aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$EC2_INSTANCE_ID" 2>/dev/null || true)"
            status="$(jq -r '.Status // "Pending"' <<<"$result")"
            case "$status" in
              Success)
                stdout="$(jq -r '.StandardOutputContent // empty' <<<"$result")"
                printf '%s\n' "$stdout"
                previous_image_uri="$(
                  sed -n 's/^PREVIOUS_IMAGE_URI=//p' <<<"$stdout" | tail -n 1
                )"
                echo "previous-image-uri=${previous_image_uri}" >> "$GITHUB_OUTPUT"
                # 로그 수집기(#47) 상태. 배포 성공 여부와는 분리돼 있어 요약으로만 알린다.
                filebeat_status="$(
                  sed -n 's/^FILEBEAT_STATUS=//p' <<<"$stdout" | tail -n 1
                )"
                echo "filebeat-status=${filebeat_status:-unknown}" >> "$GITHUB_OUTPUT"
                if [[ "$filebeat_status" == failed || "$filebeat_status" == skipped-* ]]; then
                  echo "::warning::Filebeat 로그 수집이 정상이 아닙니다: ${filebeat_status}. docs/deploy-ec2.md 참고."
                fi
                exit 0
                ;;
              Failed|Cancelled|TimedOut|DeliveryTimedOut|ExecutionTimedOut|Undeliverable|Terminated)
                jq -r '.StandardOutputContent // empty' <<<"$result"
                jq -r '.StandardErrorContent // empty' <<<"$result" >&2
                echo "::error::EC2 배포 실패: ${status}"
                exit 1
                ;;
            esac
            echo "EC2 배포 대기 중... (${status})"
            sleep 5
          done

          echo "::error::SSM 배포가 30분 안에 끝나지 않았습니다."
          exit 1

      # 배포 성공이 확인된 뒤 현재 이미지와 실제로 교체된 직전 이미지만 남긴다.
      # 배포 실패 시에는 이 단계가 실행되지 않아 롤백 후보를 먼저 지우지 않는다.
      - name: ECR 이미지 최신 2개만 유지
        id: prune
        env:
          CURRENT_IMAGE_TAG: ${{ steps.meta.outputs.image-tag }}
          PREVIOUS_IMAGE_URI: ${{ steps.ssm.outputs.previous-image-uri }}
        run: |
          python scripts/prune_ecr_images.py \
            "$ECR_REPOSITORY" \
            "$CURRENT_IMAGE_TAG" \
            "$PREVIOUS_IMAGE_URI"

      - name: 배포 요약
        if: always()
        run: |
          {
            echo "## EC2 배포"
            echo ""
            echo "| 항목 | 값 |"
            echo "|---|---|"
            echo "| 커밋 | \`${GITHUB_SHA}\` |"
            echo "| 이미지 태그 | \`${{ steps.meta.outputs.image-tag }}\` |"
            echo "| digest | \`${{ steps.build.outputs.digest }}\` |"
            echo "| 직전 이미지 | \`${{ steps.ssm.outputs.previous-image-uri || '없음' }}\` |"
            echo "| Filebeat | \`${{ steps.ssm.outputs.filebeat-status || '확인 불가' }}\` |"
            echo "| ECR 삭제 이미지 | \`${{ steps.prune.outputs.deleted-count || '0' }}\` |"
            echo "| EC2 | \`${EC2_INSTANCE_ID}\` |"
            echo "| SSM command | \`${{ steps.ssm.outputs.command-id }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
